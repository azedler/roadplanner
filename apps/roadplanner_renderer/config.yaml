# Home Assistant app configuration for the renderer proof of concept.
#
# The permission set is the point of this file. Everything that is NOT
# requested here is as deliberate as what is: no ports, no ingress, no host
# network, no privileged mode, no Supervisor or Home Assistant API, no
# access to /config and no secrets. The app gets exactly one thing beyond a
# plain container - a read/write mount of /share - because that shared
# directory is the entire communication channel.
name: Roadplanner Renderer (PoC)
version: "0.30.0"
slug: roadplanner_renderer_poc
description: >-
  Experimenteller Renderer. Enthaelt Remotion und Chromium und erzeugt auf
  Anforderung ein fuenfsekuendiges Testvideo. Kein Produktivexport: der
  bestehende PDF- und ffmpeg-Weg von Roadplanner bleibt unberuehrt.
url: https://github.com/azedler/roadplanner/tree/main/apps/roadplanner_renderer
# Marks the app as an experiment in the Home Assistant store, so it can
# never be mistaken for a finished feature.
stage: experimental
arch:
  - amd64
# The worker handles SIGTERM itself and has no child processes to reap, so
# it does not need an init wrapper.
init: false
startup: application
# Manual start: an experiment must not come up by itself after a reboot.
boot: manual
apparmor: true
host_network: false
ingress: false
map:
  - type: share
    read_only: false
image: ghcr.io/azedler/roadplanner-renderer-poc-{arch}
options:
  log_level: info
  # How much room finished results may take in the shared folder, in GiB.
  # Reachable here because it was not reachable anywhere: the environment
  # variable existed, the app configuration did not offer it, and a user
  # whose film was larger than the budget had no way to help themselves.
  # The default matches two of the largest film the renderer will make -
  # a film and its scored version have to fit side by side, because
  # producing the second one reads the first.
  max_result_gib: 4
schema:
  log_level: list(debug|info|warning|error)
  max_result_gib: float(1,64)
