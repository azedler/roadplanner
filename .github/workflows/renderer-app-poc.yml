# CI for the renderer app.
#
# Its own workflow on purpose: this is an experiment, and it must never be
# able to slow down or block an ordinary Roadplanner release.
name: Renderer app PoC

on:
  push:
    branches:
      - develop
      - "claude/**"
    paths:
      - "apps/roadplanner_renderer/**"
      - "custom_components/roadplanner_mcp/renderer_app_*.py"
      - "tests/test_renderer_app_*.py"
      - ".github/workflows/renderer-app-poc.yml"
  pull_request:
    paths:
      - "apps/roadplanner_renderer/**"
      - "custom_components/roadplanner_mcp/renderer_app_*.py"
      - "tests/test_renderer_app_*.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  worker:
    name: Worker and protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned dependencies
        working-directory: apps/roadplanner_renderer
        run: npm ci

      - name: Syntax and types
        working-directory: apps/roadplanner_renderer
        run: |
          npm run check
          npx tsc --noEmit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Protocol rules
        run: python3 tests/test_renderer_app_protocol.py

      - name: Home Assistant side
        run: python3 tests/test_renderer_app_client.py

      # The real worker, the real Python side, a real directory. The two
      # implementations share no code, so only this proves they agree.
      - name: End-to-end through a real exchange folder
        run: python3 tests/test_renderer_app_end_to_end.py

      # Pillow reaches the other workflows only as a transitive dependency
      # of reportlab, which is not a thing to rely on for an image test.
      - name: Render package rules
        run: |
          python3 -m pip install --quiet pillow
          node tests/test_renderer_app_trip_day_package.mjs
          python3 tests/test_trip_film_package.py

      # Everything the renderer refuses BEFORE a browser starts: a missing
      # package, changed bytes, a symlink. Lives beside the app because it
      # imports the render module.
      - name: What the renderer refuses to read
        working-directory: apps/roadplanner_renderer
        run: node tests/package-reading.mjs

      - name: Cross-file wiring and boundaries
        run: python3 tests/test_renderer_app_contract.py

  image:
    name: Container image and Remotion render
    runs-on: ubuntu-latest
    needs: worker
    steps:
      - uses: actions/checkout@v4

      - name: Build the app image
        id: build
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' apps/roadplanner_renderer/config.yaml | cut -d'"' -f2)
          START=$(date +%s)
          docker build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:bookworm-2026.02.0 \
            --build-arg APP_VERSION="${VERSION}" \
            --tag roadplanner-renderer:ci \
            apps/roadplanner_renderer
          echo "build_seconds=$(( $(date +%s) - START ))" >> "${GITHUB_OUTPUT}"
          SIZE=$(docker image inspect roadplanner-renderer:ci --format '{{.Size}}')
          echo "image_bytes=${SIZE}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      # Starting the container is a different claim from building it.
      - name: Start it and wait for a ready heartbeat
        run: |
          set -euo pipefail
          # The container runs as root and would otherwise create these
          # directories root-owned, leaving the runner user unable to write
          # a job into them. Creating them here first is what keeps both
          # sides able to use the shared folder - the same question the
          # real deployment answers with a /share mount.
          mkdir -p "${RUNNER_TEMP}/exchange"/{jobs,processing,status,results,inputs}
          chmod -R 777 "${RUNNER_TEMP}/exchange"
          START=$(date +%s%3N)
          docker run --rm --detach \
            --name renderer \
            --volume "${RUNNER_TEMP}/exchange:/share/roadplanner-renderer/poc-v1" \
            roadplanner-renderer:ci
          for _ in $(seq 1 60); do
            if grep -q '"state": "ready"' "${RUNNER_TEMP}/exchange/renderer-status.json" 2>/dev/null; then
              echo "startup_ms=$(( $(date +%s%3N) - START ))" >> "${GITHUB_ENV}"
              cat "${RUNNER_TEMP}/exchange/renderer-status.json"
              exit 0
            fi
            sleep 1
          done
          echo "Kein einsatzbereiter Heartbeat innerhalb von 60 s" >&2
          docker logs renderer >&2 || true
          exit 1

      # Two renders: the first pays for a cold browser and cold page cache,
      # the second is what a second job on a warm container actually costs.
      # Reporting only one of them would misrepresent both.
      - name: Render twice and validate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time, uuid
          exchange = pathlib.Path(os.environ["RUNNER_TEMP"]) / "exchange"
          for name in ("jobs", "results", "status"):
              (exchange / name).mkdir(parents=True, exist_ok=True)
          results = []
          for label in ("kalt", "warm"):
              job_id = str(uuid.uuid4())
              now = time.time()
              job = {
                  "schema_version": 1,
                  "protocol_version": 1,
                  "job_id": job_id,
                  "action": "render_remotion_test",
                  "created_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(now)),
                  "expires_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(now + 1800)),
                  "input": {"message": "Roadplanner Remotion Test"},
              }
              target = exchange / "jobs" / f"{job_id}.json"
              tmp = target.with_suffix(".json.part")
              tmp.write_text(json.dumps(job))
              tmp.replace(target)

              result_file = exchange / "results" / job_id / "result.json"
              deadline = time.time() + 900
              while time.time() < deadline and not result_file.is_file():
                  status = exchange / "status" / f"{job_id}.json"
                  if status.is_file():
                      state = json.loads(status.read_text()).get("state")
                      if state in ("failed", "expired"):
                          print(status.read_text())
                          raise SystemExit(f"Render {label} fehlgeschlagen")
                  time.sleep(2)
              if not result_file.is_file():
                  raise SystemExit(f"Render {label} lief in eine Zeitüberschreitung")
              payload = json.loads(result_file.read_text())
              print(f"--- {label} ---")
              print(json.dumps({"video": payload.get("video"), "timings": payload.get("timings")}, indent=2))
              results.append({"label": label, **payload})
          pathlib.Path(os.environ["RUNNER_TEMP"], "renders.json").write_text(json.dumps(results, indent=2))
          PY

      # The mini export's own route: a package of real image files plus a
      # manifest, written the way Roadplanner writes it - images first, job
      # last. Proving this in CI means the data path is not being tried for
      # the first time on somebody's Home Assistant.
      - name: Render one trip day from a package
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, time, uuid
          from PIL import Image

          exchange = pathlib.Path(os.environ["RUNNER_TEMP"]) / "exchange"
          job_id = str(uuid.uuid4())
          inputs = exchange / "inputs" / job_id
          inputs.mkdir(parents=True, exist_ok=True)

          images = []
          for index in range(1, 4):
              picture = Image.new("RGB", (1280, 853))
              for x in range(0, 1280, 16):
                  for y in range(0, 853, 16):
                      picture.paste(
                          ((x * index) % 256, (y * index) % 256, (x + y) % 256),
                          (x, y, x + 16, y + 16),
                      )
              buffer = io.BytesIO()
              picture.save(buffer, format="JPEG", quality=82, optimize=True)
              blob = buffer.getvalue()
              (inputs / f"photo-{index}.jpg").write_bytes(blob)
              images.append(
                  {
                      "index": index,
                      "size_bytes": len(blob),
                      "sha256": hashlib.sha256(blob).hexdigest(),
                  }
              )

          package = {
              "package_version": 1,
              "job_id": job_id,
              "trip_title": "Finnland 2026",
              "day": {
                  "day_id": "day-7",
                  "date": "2026-08-05",
                  "title": "Von Tampere nach Vaasa",
                  "summary": "Ein langer Fahrtag am See entlang, mit Pause in Seinäjoki.",
                  "number": 7,
                  "count": 21,
                  "distance_km": 214.6,
                  "duration_minutes": 195,
              },
              "stops": [
                  {"name": "Tampere", "time": "09:00"},
                  {"name": "Seinäjoki", "time": "12:30"},
                  {"name": "Vaasa", "time": "16:10"},
              ],
              "images": images,
              "total_image_bytes": sum(entry["size_bytes"] for entry in images),
          }
          (inputs / "package.json").write_text(json.dumps(package, ensure_ascii=False))

          # The job goes last, exactly as Roadplanner writes it: its
          # existence has to imply a complete package.
          now = time.time()
          job = {
              "schema_version": 1,
              "protocol_version": 1,
              "job_id": job_id,
              "action": "render_trip_day",
              "created_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(now)),
              "expires_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(now + 1800)),
              "input": {"message": "Von Tampere nach Vaasa"},
          }
          target = exchange / "jobs" / f"{job_id}.json"
          temporary = target.with_suffix(".json.part")
          temporary.write_text(json.dumps(job))
          temporary.replace(target)

          result_file = exchange / "results" / job_id / "result.json"
          deadline = time.time() + 900
          while time.time() < deadline and not result_file.is_file():
              status = exchange / "status" / f"{job_id}.json"
              if status.is_file():
                  state = json.loads(status.read_text()).get("state")
                  if state in ("failed", "expired"):
                      print(status.read_text())
                      raise SystemExit("Tagesvideo fehlgeschlagen")
              time.sleep(2)
          if not result_file.is_file():
              raise SystemExit("Tagesvideo lief in eine Zeitüberschreitung")

          payload = json.loads(result_file.read_text())
          print(json.dumps({k: payload.get(k) for k in ("video", "timings")}, indent=2))

          video = payload["video"]
          # 60 + 75 + 3*51 + 54 = 342 frames at 30 fps.
          assert abs(video["duration_seconds"] - 342 / 30) < 0.25, video
          assert (video["width"], video["height"]) == (1280, 720), video
          assert video["codec"] == "h264", video
          assert video["photo_count"] == 3, video
          assert payload["artifacts"][0]["filename"] == "roadplanner-trip-day.mp4"

          # The package holds somebody's photos. It must not survive the job.
          assert not inputs.exists(), "Das Renderpaket wurde nicht aufgeräumt"
          pathlib.Path(os.environ["RUNNER_TEMP"], "tripday.json").write_text(
              json.dumps(payload, indent=2)
          )
          print(f"Renderpaket: {package['total_image_bytes']} B in {len(images)} Bildern")
          PY

      # The success path already proves the package is removed. This is the
      # other half: a job that FAILS must not leave somebody's photos in a
      # shared directory either. The deletion sits in the job's `finally`,
      # so it should hold - "should" is why this runs.
      - name: A failed job cleans up after itself too
        run: |
          set -euo pipefail
          python3 - <<'INNER'
          import hashlib, io, json, os, pathlib, time, uuid
          from PIL import Image

          exchange = pathlib.Path(os.environ["RUNNER_TEMP"]) / "exchange"
          job_id = str(uuid.uuid4())
          inputs = exchange / "inputs" / job_id
          inputs.mkdir(parents=True, exist_ok=True)

          picture = Image.new("RGB", (640, 360), (30, 60, 90))
          buffer = io.BytesIO()
          picture.save(buffer, format="JPEG", quality=82)
          blob = buffer.getvalue()
          (inputs / "photo-1.jpg").write_bytes(blob)

          # The declared hash belongs to DIFFERENT bytes. The renderer has
          # to refuse this before it starts a browser.
          wrong = hashlib.sha256(blob + b"nicht dieselben Bytes").hexdigest()
          package = {
              "package_version": 1,
              "job_id": job_id,
              "trip_title": "Finnland 2026",
              "day": {
                  "day_id": "day-9",
                  "date": "2026-08-06",
                  "title": "Ein Tag, der nicht gerendert werden darf",
                  "summary": "",
                  "number": 9,
                  "count": 21,
                  "distance_km": None,
                  "duration_minutes": None,
              },
              "stops": [{"name": "Vaasa", "time": ""}],
              "images": [{"index": 1, "size_bytes": len(blob), "sha256": wrong}],
              "total_image_bytes": len(blob),
          }
          (inputs / "package.json").write_text(json.dumps(package, ensure_ascii=False))

          now = time.time()
          job = {
              "schema_version": 1,
              "protocol_version": 1,
              "job_id": job_id,
              "action": "render_trip_day",
              "created_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(now)),
              "expires_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(now + 1800)),
              "input": {"message": "Ein Tag, der nicht gerendert werden darf"},
          }
          target = exchange / "jobs" / f"{job_id}.json"
          temporary = target.with_suffix(".json.part")
          temporary.write_text(json.dumps(job))
          temporary.replace(target)

          status_file = exchange / "status" / f"{job_id}.json"
          deadline = time.time() + 180
          state = None
          while time.time() < deadline:
              if status_file.is_file():
                  status = json.loads(status_file.read_text())
                  state = status.get("state")
                  if state in ("failed", "expired", "completed"):
                      break
              time.sleep(1)
          print(json.dumps(status if state else {}, indent=2))
          assert state == "failed", f"erwartet failed, bekommen {state}"
          assert status["error"]["code"] == "PACKAGE_INVALID", status["error"]

          # No result was produced, and - the point of this test - the
          # photos are gone.
          for _ in range(15):
              if not inputs.exists():
                  break
              time.sleep(1)
          assert not inputs.exists(), "Das Renderpaket blieb nach dem Fehlschlag liegen"
          assert not (exchange / "results" / job_id).exists(), "Es gibt ein Ergebnis, obwohl der Job scheiterte"
          print("Fehlgeschlagener Job: Renderpaket aufgeraeumt, kein Ergebnis erzeugt")
          INNER

      # The whole point of the film: twenty-five days in one render. If the
      # manifest cannot carry a trip, this is where it shows - and it shows
      # here rather than on somebody's Home Assistant.
      - name: Render a whole 25-day trip film
        run: |
          set -euo pipefail
          python3 - <<'INNER'
          import hashlib, importlib.util, io, json, os, pathlib, sys, time, uuid
          from PIL import Image

          # The REAL planner, not a hand-written imitation of one. A fake
          # whose shape the test author chooses can only confirm what they
          # already believed - which is exactly how a wrong field name
          # shipped earlier in this project.
          sys.dont_write_bytecode = True
          spec = importlib.util.spec_from_file_location(
              "trip_film_plan",
              "custom_components/roadplanner_mcp/trip_film_plan.py",
          )
          plan_module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(plan_module)
          map_spec = importlib.util.spec_from_file_location(
              "trip_map_context",
              "custom_components/roadplanner_mcp/trip_map_context.py",
          )
          map_module = importlib.util.module_from_spec(map_spec)
          map_spec.loader.exec_module(map_module)

          DAYS = 25
          # The film has to look different from day to day, so the CI film
          # exercises every importance and every style rather than one.
          WEIGHTS = ["transition", "normal", "highlight", "major_highlight"]
          STYLES = ["normal", "compact", "hero", "collage", "map_focus"]
          ROLES = ["opening", "journey", "transition", "highlight", "finale"]
          exchange = pathlib.Path(os.environ["RUNNER_TEMP"]) / "exchange"
          job_id = str(uuid.uuid4())
          inputs = exchange / "inputs" / job_id
          (inputs / "photos").mkdir(parents=True, exist_ok=True)

          chapters = []
          total = 0
          for day in range(DAYS):
              images = []
              # Day 7 gets no photos on purpose: the film has to show that
              # gap rather than skip the day.
              importance = WEIGHTS[day % len(WEIGHTS)]
              count = 0 if day == 6 else plan_module.PHOTO_WEIGHTS[importance]
              for slot in range(1, count + 1):
                  # Every third picture is upright. A portrait photograph
                  # filled into a 16:9 frame loses its top and bottom, so
                  # the CI film has to contain some or the composition's
                  # handling of them is never exercised.
                  upright = (day + slot) % 3 == 0
                  width, height = (600, 900) if upright else (900, 600)
                  picture = Image.new("RGB", (width, height))
                  for x in range(0, width, 20):
                      for y in range(0, height, 20):
                          picture.paste(
                              ((x + day * 9) % 256, (y + slot * 40) % 256, (x + y) % 256),
                              (x, y, x + 20, y + 20),
                          )
                  buffer = io.BytesIO()
                  picture.save(buffer, format="JPEG", quality=76, optimize=True)
                  blob = buffer.getvalue()
                  relative = f"photos/c{day:02d}-{slot}.jpg"
                  (inputs / relative).write_bytes(blob)
                  total += len(blob)
                  images.append(
                      {
                          "path": relative,
                          "size_bytes": len(blob),
                          "sha256": hashlib.sha256(blob).hexdigest(),
                          "width": width,
                          "height": height,
                          "orientation": "portrait" if upright else "landscape",
                      }
                  )
              chapters.append(
                  {
                      "chapter_id": f"day-{day + 1}",
                      "index": day,
                      "date": "2026-07-17",
                      "title": f"Etappe {day + 1}",
                      "story": (
                          f"Tag {day + 1} fuehrt weiter nach Norden. "
                          "215 Kilometer und 3 Stunden liegen dazwischen."
                      ),
                      "story_source": "directed",
                      "importance": importance,
                      "visual_style": STYLES[day % len(STYLES)],
                      "story_role": ROLES[day % len(ROLES)],
                      "day_number": day + 1,
                      "distance_km": 180.0 + day,
                      "duration_minutes": 150 + day,
                      "stop_count": 2,
                      "photo_count": 40,
                      "stops": ["Tampere", "Vaasa"],
                      "images": images,
                  }
              )

          # The map, built by the real module from routing-shaped data -
          # including a ferry, which the roadbook records as a mode rather
          # than leaving to a guess.
          map_chapters = []
          for day in range(DAYS):
              start = (23.0 + day * 0.35, 61.0 + day * 0.22)
              end = (23.0 + (day + 1) * 0.35, 61.0 + (day + 1) * 0.22)
              mode = "ferry" if day == 11 else "driving"
              line = [
                  [
                      start[0] + (end[0] - start[0]) * step / 40,
                      start[1] + (end[1] - start[1]) * step / 40,
                  ]
                  for step in range(41)
              ]
              routed = {
                  "id": f"day-{day + 1}",
                  "details": {
                      "routing": {
                          "segments": [
                              {"mode": mode, "geometry": {"type": "LineString", "coordinates": line}}
                          ]
                      }
                  },
              }
              map_chapters.append(
                  {
                      "chapter_id": f"day-{day + 1}",
                      "index": day,
                      "map": map_module.chapter_map(routed, []),
                  }
              )
          map_context = map_module.validate_map_context(
              map_module.build_map_context(map_chapters)
          )
          print(
              f"Kartenkontext: {map_context['chapter_count']} Kapitel, "
              f"{map_context['point_count']} Punkte, Faehre: {map_context['has_ferry']}"
          )

          package = {
              "film_package_version": 1,
              "job_id": job_id,
              "manifest_content_hash": "a" * 64,
              "manifest_version": 1,
              "trip": {
                  "title": "Finnland 2026",
                  "start_date": "2026-07-17",
                  "end_date": "2026-08-10",
                  "chapter_count": DAYS,
                  "distance_km": 4500.0,
                  "photo_count": 812,
              },
              "narrative": {
                  "title_variant": "Drei Wochen Norden",
                  "subtitle": "Ein Sommer mit zu wenig Schlaf",
                  "opening": "Es begann mit einem verpassten Kaffee.",
                  "closing": "Und endete mit Sand im Auto.",
                  "motifs": ["Wasser", "lange Abende"],
              },
              "map_context": map_context,
              "chapters": chapters,
              "total_image_bytes": total,
          }
          package["scene_plan"] = plan_module.build_scene_plan(
              trip=package["trip"],
              chapters=chapters,
              narrative=package["narrative"],
              outro_photos=[c["images"][0] for c in chapters if c["images"]][:6],
              map_context=map_context,
          )
          seconds = plan_module.plan_seconds(package["scene_plan"])
          print(
              f"Szenenplan: {len(package['scene_plan']['scenes'])} Szenen, {seconds} s"
          )
          (inputs / "film.json").write_text(json.dumps(package, ensure_ascii=False))

          now = time.time()
          job = {
              "schema_version": 1,
              "protocol_version": 1,
              "job_id": job_id,
              "action": "render_trip_film",
              "created_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(now)),
              "expires_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(now + 3600)),
              "input": {"message": "Finnland 2026"},
          }
          target = exchange / "jobs" / f"{job_id}.json"
          temporary = target.with_suffix(".json.part")
          temporary.write_text(json.dumps(job))
          temporary.replace(target)
          print(f"Filmpaket: {total} B in {sum(len(c['images']) for c in chapters)} Bildern")

          result_file = exchange / "results" / job_id / "result.json"
          deadline = time.time() + 2400
          while time.time() < deadline and not result_file.is_file():
              status = exchange / "status" / f"{job_id}.json"
              if status.is_file():
                  state = json.loads(status.read_text()).get("state")
                  if state in ("failed", "expired"):
                      print(status.read_text())
                      raise SystemExit("Reisefilm fehlgeschlagen")
              time.sleep(5)
          if not result_file.is_file():
              raise SystemExit("Reisefilm lief in eine Zeitueberschreitung")

          payload = json.loads(result_file.read_text())
          print(json.dumps({k: payload.get(k) for k in ("video", "timings")}, indent=2))
          video = payload["video"]
          # Checked against the plan this step built, not against a
          # second copy of the rules. The old assertion recomputed film
          # v0's frame formula by hand and went red the moment the
          # dramaturgy changed - while the render itself was perfect.
          # Comparing the video to the plan is also the stronger claim:
          # it says the film is exactly as long as it was planned to be.
          assert abs(video["duration_seconds"] - seconds) < 0.3, (video, seconds)
          assert (video["width"], video["height"]) == (1280, 720), video
          assert video["chapter_count"] == DAYS, video
          assert video["chapters_without_photos"] == 1, video
          assert payload["artifacts"][0]["filename"] == "roadplanner-trip-film.mp4"
          assert not inputs.exists(), "Das Filmpaket wurde nicht aufgeraeumt"
          pathlib.Path(os.environ["RUNNER_TEMP"], "film.json").write_text(
              json.dumps(payload, indent=2)
          )
          print(
              f"Film: {video['duration_seconds']} s, {video['size_bytes']} B, "
              f"{video['chapter_count']} Kapitel, {video['photo_count']} Bilder"
          )
          INNER

      # The status file carries the message a user is meant to read, which
      # is deliberately free of stack traces and paths. When a render fails
      # in CI the cause is what matters, and it is in the app log.
      - name: App log after a failed render
        if: failure()
        run: docker logs renderer 2>&1 || true

      - name: Resource use and measurement summary
        if: always()
        run: |
          set -euo pipefail
          docker stats --no-stream --format '{{.Name}}: CPU {{.CPUPerc}} RAM {{.MemUsage}}' renderer || true
          python3 - <<'PY'
          import json, os, pathlib
          out = ["### Renderer-App: Messungen", ""]
          size = int(os.environ.get("IMAGE_BYTES", "0") or 0)
          out.append(f"- Containergröße: {round(size / 1024 / 1024)} MB")
          out.append(f"- Build: {os.environ.get('BUILD_SECONDS', '?')} s")
          out.append(f"- Start bis einsatzbereit: {os.environ.get('startup_ms', '?')} ms")
          path = pathlib.Path(os.environ["RUNNER_TEMP"], "renders.json")
          if path.is_file():
              for entry in json.loads(path.read_text()):
                  t = entry.get("timings", {})
                  v = entry.get("video", {})
                  out.append(
                      f"- Render {entry['label']}: gesamt {t.get('total')} s "
                      f"(Browser {t.get('browser_start')} s, Render {t.get('render')} s, "
                      f"ffprobe {t.get('probe')} s), {v.get('size_bytes')} B, "
                      f"{v.get('duration_seconds')} s, {v.get('codec')} "
                      f"{int(v.get('width') or 0)}x{int(v.get('height') or 0)}"
                  )
          pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(out) + "\n")
          print("\n".join(out))
          PY
        env:
          IMAGE_BYTES: ${{ steps.build.outputs.image_bytes }}
          BUILD_SECONDS: ${{ steps.build.outputs.build_seconds }}

      - name: Stop it and prove SIGTERM is honoured
        if: always()
        run: |
          set -euo pipefail
          START=$(date +%s)
          docker stop --timeout 15 renderer || true
          echo "Stop dauerte $(( $(date +%s) - START )) s"

      - name: Clean up
        if: always()
        run: docker rm --force renderer 2>/dev/null || true

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: image
    # Never from a pull request. Home Assistant installs the app by PULLING
    # this image, so without it the device test cannot happen - but it stays
    # an experiment: no `latest`, and nothing in the Roadplanner release
    # workflow refers to it.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/${{ github.repository_owner }}/roadplanner-renderer-poc-amd64
          VERSION=$(grep '^version:' apps/roadplanner_renderer/config.yaml | cut -d'"' -f2)
          docker build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:bookworm-2026.02.0 \
            --build-arg APP_VERSION="${VERSION}" \
            --tag "${IMAGE}:${VERSION}" \
            apps/roadplanner_renderer
          docker push "${IMAGE}:${VERSION}"
          # A tag can move, a digest cannot - the report carries the digest.
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}")
          {
            echo "### Renderer-App-Image"
            echo ""
            echo "- Tag: \`${IMAGE}:${VERSION}\`"
            echo "- Digest: \`${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
